name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 22 * * 0'  # Sunday 22:00 UTC — Docker build+push
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: |
          go mod tidy
          if ! test -z "$(git status --porcelain)"; then
            echo "Run 'go mod tidy' before committing"
            git diff --exit-code
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  # TAG FIRST: version + GitHub release + zip artifacts, on every functional push.
  tag:
    name: Tag
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git
        run: |
          git config user.name "leojara95"
          git config user.email "268038834+leojara95@users.noreply.github.com"

      - name: Determine version
        id: version
        run: |
          LATEST=$(git tag --list 'v*' | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then BASE="v0.0.0"; else BASE="$LATEST"; fi
          BASE_NUM="${BASE#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_NUM:-0.0.0}"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          if [ -z "$LATEST" ]; then RANGE="HEAD"; else RANGE="${LATEST}..HEAD"; fi
          COMMITS=$(git log "$RANGE" --format='%s%b' 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commits"
            exit 0
          fi
          if echo "$COMMITS" | grep -qE '^.*?\([^)]*\)?!:|^BREAKING[ -]CHANGE:'; then
            if [ "$MAJOR" = "0" ]; then TAG="v0.$((MINOR+1)).0"; else TAG="v$((MAJOR+1)).0.0"; fi
          elif echo "$COMMITS" | grep -q '^feat'; then
            TAG="v$MAJOR.$((MINOR+1)).0"
          elif echo "$COMMITS" | grep -qE '^fix|^perf'; then
            TAG="v$MAJOR.$MINOR.$((PATCH+1))"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No functional changes"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping ${LATEST:-<none>} -> $TAG"

      - name: Build zips
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 darwin/arm64; do
            OS="${target%/*}"; ARCH="${target#*/}"
            GOOS="$OS" GOARCH="$ARCH" CGO_ENABLED=0 go build -o dist/neural-db .
            (cd dist && zip -q "neural-db_${TAG}_${OS}_${ARCH}.zip" neural-db && rm -f neural-db)
          done
          ls -la dist/

      - name: Tag and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: GitHub release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.zip

  # DOCKER LATER: Sunday only, and idempotent (skip if the image for the latest
  # tag already exists — no rebuild when nothing new).
  docker:
    name: Docker
    needs: [lint, test]
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event.schedule == '0 22 * * 0' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest tag
        id: tag
        run: |
          VER=$(git tag --list 'v*' | sort -V | tail -1 || true)
          if [ -z "$VER" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No release tag yet — nothing to build"
          else
            echo "ver=$VER" >> "$GITHUB_OUTPUT"
            echo "Latest tag: $VER"
          fi

      - name: Skip if image already exists
        id: check
        if: steps.tag.outputs.skip != 'true'
        env:
          VER: ${{ steps.tag.outputs.ver }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/natuleadan/neural-db:${VER}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image ${VER} already built — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Image ${VER} missing — building"
          fi

      - name: Build and push image
        if: steps.tag.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        env:
          VER: ${{ steps.tag.outputs.ver }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/natuleadan/neural-db:${{ steps.tag.outputs.ver }}
            ghcr.io/natuleadan/neural-db:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
