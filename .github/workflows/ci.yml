name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 22 * * 0'  # Sunday 22:00 UTC — Docker build+push
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: |
          go mod tidy
          if ! test -z "$(git status --porcelain)"; then
            echo "Run 'go mod tidy' before committing"
            git diff --exit-code
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  docker:
    name: Docker
    needs: [lint, test]
    # Docker build+push: only Sunday 22:00 UTC or manual dispatch
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event.schedule == '0 22 * * 0' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/natuleadan/neural-db:${{ github.sha }}
            ghcr.io/natuleadan/neural-db:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    name: Tag
    needs: [lint, test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "leojara95"
          git config user.email "268038834+leojara95@users.noreply.github.com"

      - name: Determine version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          if [ "$LATEST" = "v0.0.0" ]; then
            echo "tag=v0.0.1" >> "$GITHUB_OUTPUT"
            echo "First release: v0.0.1"
            exit 0
          fi
          COMMITS=$(git log "$LATEST..HEAD" --format="%s%b" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commits since $LATEST"
            exit 0
          fi
          if echo "$COMMITS" | grep -qE '^.*?\([^)]*\)?!:|^BREAKING[ -]CHANGE:'; then
            if [ "$MAJOR" = "0" ]; then
              echo "tag=v0.$((MINOR+1)).0" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v$((MAJOR+1)).0.0" >> "$GITHUB_OUTPUT"
            fi
          elif echo "$COMMITS" | grep -q '^feat'; then
            echo "tag=v$MAJOR.$((MINOR+1)).0" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE '^fix|^perf'; then
            echo "tag=v$MAJOR.$MINOR.$((PATCH+1))" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No functional changes"
          fi

      - name: Tag and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Release notes
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
